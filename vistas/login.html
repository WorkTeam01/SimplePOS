<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>SimplePOS | Login</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <!-- Bootstrap 3.3.7 -->
  <link rel="stylesheet" href="../public/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="../public/css/font-awesome.min.css">
  <link rel="stylesheet" href="../public/css/AdminLTE.min.css">
  <link rel="stylesheet" href="../public/css/_all-skins.min.css">
  <link rel="icon" type="image/png" href="../public/img/icono.png">
  <!-- Estilos personalizados para el login -->
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .login-box {
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
      max-width: 400px;
      width: 90%;
    }

    .login-logo {
      margin-bottom: 0;
      padding: 20px 0 5px 0;
      /* Reducido aún más el padding inferior */
      background-color: #fff;
      text-align: center;
    }

    .login-logo a {
      color: #333;
      font-weight: 600;
      margin-bottom: 0;
      display: block;
    }

    .login-box-body {
      padding: 10px 30px 30px;
      /* Reducido aún más el padding superior */
      border-radius: 0 0 8px 8px;
    }

    .login-box-msg {
      font-size: 18px;
      color: #444;
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      /* Reducido el margen inferior */
    }

    .form-control {
      height: 45px;
      border-radius: 4px;
      box-shadow: none;
      border: 1px solid #ddd;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #3c8dbc;
      box-shadow: 0 0 8px rgba(60, 141, 188, 0.1);
    }

    .btn-primary {
      background-color: #3c8dbc;
      border-color: #367fa9;
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 4px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #367fa9;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: #000000;
      font-size: 14px;
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .has-feedback .form-control-feedback {
      line-height: 45px;
      color: #999;
    }

    .brand-image {
      height: 60px;
      margin-bottom: 5px;
      /* Reducido el margen inferior */
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="../public/img/logo.png" class="img-circle brand-image" alt="SimplePOS">
      <a href="#"><b>Simple</b>POS</a>
    </div>
    <!-- /.login-logo -->
    <div class="login-box-body">
      <p class="login-box-msg">Bienvenido al Sistema</p>

      <form method="post" id="frmAcceso">
        <div class="form-group has-feedback">
          <input type="text" id="numdocumentoa" name="numdocumentoa" class="form-control"
            placeholder="Número de Documento" autofocus>
          <span class="fa fa-user form-control-feedback"></span>
        </div>
        <div class="form-group has-feedback">
          <input type="password" id="clavea" name="clavea" class="form-control" placeholder="Contraseña">
          <span class="fa fa-lock form-control-feedback"></span>
        </div>
        <div class="row">
          <div class="col-xs-12">
            <button type="submit" class="btn btn-primary btn-block">INGRESAR AL SISTEMA</button>
          </div>
        </div>
      </form>
    </div>
    <!-- /.login-box-body -->
  </div>
  <!-- /.login-box -->

  <div class="login-footer">
    <p>&copy; 2025 SimplePOS - Open Source POS System</p>
  </div>

  <!-- jQuery 3 -->
  <script src="../public/js/jquery.min.js"></script>
  <!-- Bootstrap 3.3.7 -->
  <script src="../public/js/bootstrap.min.js"></script>
  <script src="../public/js/bootbox.min.js"></script>
  <script src="scripts/login.js"></script>

</body>

</html>
